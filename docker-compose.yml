services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: results_togyz
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    # Schema + seeds are not auto-applied on container init (postgres's
    # docker-entrypoint-initdb.d only runs top-level scripts, not the
    # numbered subdirectories db/build and db/seeds use) — run
    # `db/rebuild.sh` after `docker compose up -d` instead; see db/README.md.
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 2s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
